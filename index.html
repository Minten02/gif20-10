<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi chị Moon</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--night:#080c2a;--deep:#1c1f56;--silver:#f3ecd2;--rose:#f2b5c4;--dim:#9aa0c8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--night:#080c2a;--deep:#1c1f56}}
:root[data-theme="dark"]{--night:#080c2a;--deep:#1c1f56}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:radial-gradient(ellipse at 50% 25%,var(--deep),var(--night) 72%);color:var(--silver);
  font-family:'Lora',Georgia,serif;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,4vh,38px);padding:0 26px;text-align:center}
#stage{position:relative;width:min(66vw,290px);aspect-ratio:1}
#stage>*{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:scale(.82);transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.8,.2,1)}
#stage[data-s=moon] #moon,#stage[data-s=crystal] #crystal,#stage[data-s=clover] #clover{opacity:1;transform:scale(1)}
body.hasph #stage[data-s=crystal] #galaxy{opacity:1;transform:scale(1)}
.core{overflow:hidden;transition:inset .8s ease}
.core.v{inset:11%}
.core video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s}
.core.v video{opacity:1}

/* Tinh hà + ảnh bay quanh trăng */
#neb{position:fixed;inset:0;opacity:0;transition:opacity 2.4s,filter 1.6s;pointer-events:none;filter:blur(10px);animation:drift 24s ease-in-out infinite alternate;background:radial-gradient(40% 35% at 25% 30%,rgba(40,120,255,.4),transparent 70%),radial-gradient(45% 40% at 78% 65%,rgba(40,200,120,.35),transparent 70%),radial-gradient(35% 30% at 60% 15%,rgba(60,220,200,.3),transparent 70%)}
body.gx #neb{opacity:1}
@keyframes drift{to{transform:scale(1.12) rotate(5deg)}}
#galaxy{perspective:900px;overflow:visible;--R:min(40vw,190px);--w:min(21vw,88px)}
#ring{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(-12deg);animation:orb 30s linear infinite}
@keyframes orb{from{transform:rotateX(-12deg) rotateY(0)}to{transform:rotateX(-12deg) rotateY(360deg)}}
.ph{position:absolute;left:50%;top:50%;width:var(--w);aspect-ratio:3/4;margin:calc(var(--w)*-.67) 0 0 calc(var(--w)*-.5);border-radius:10px;background-size:cover;background-position:center;border:2px solid rgba(255,255,255,.8);box-shadow:0 0 22px rgba(160,190,255,.55);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transform:rotateY(var(--a)) translateZ(var(--R)) translateY(var(--y))}
#moon{filter:drop-shadow(0 0 calc(8px + var(--glow,0)*54px) rgba(243,236,210,calc(.15 + var(--glow,0)*.55)))}
#sh{transition:transform 2s cubic-bezier(.3,.1,.2,1)}
/* Viên pha lê */
#crystal{--h:340}
.aur{position:absolute;inset:-30%;border-radius:50%;filter:blur(34px);opacity:.55;
  background:conic-gradient(from 0deg,hsl(var(--h),90%,60%),hsl(calc(var(--h) + 60),90%,62%),hsl(calc(var(--h) - 50),90%,55%),hsl(var(--h),90%,60%));animation:spin 14s linear infinite;
  -webkit-mask:radial-gradient(circle,transparent 28%,#000 55%,transparent 72%);mask:radial-gradient(circle,transparent 28%,#000 55%,transparent 72%)}
.core{position:absolute;inset:22%;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff,hsl(var(--h),95%,78%) 38%,hsl(var(--h),80%,42%) 100%);
  box-shadow:0 0 50px 8px hsla(var(--h),95%,65%,.6),inset -10px -14px 26px hsla(var(--h),90%,30%,.55);animation:pulse 3.4s ease-in-out infinite}
.ring{position:absolute;inset:6%;border-radius:50%;border:1.5px solid hsla(var(--h),95%,82%,.55);animation:spin 9s linear infinite}
.ring.b{inset:-4%;border-style:dashed;border-color:hsla(var(--h),95%,82%,.35);animation-duration:17s;animation-direction:reverse}
.ring i{position:absolute;top:-5px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px hsl(var(--h),95%,75%)}
.ring.b i{top:auto;bottom:-5px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.07)}}
/* Cỏ bốn lá */
#clover{overflow:visible}
#clover .sway{transform-origin:100px 190px;animation:sway 4.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
/* Chữ */
#line{font-size:clamp(20px,5.2vw,28px);line-height:1.55;max-width:20em;min-height:4.8em;margin:0}
#line span{display:inline-block;margin-right:.28em;animation:wd .9s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes wd{from{opacity:0;filter:blur(7px);transform:translateY(10px)}}
#line.final{font-size:clamp(28px,8vw,44px);font-style:italic;color:var(--rose)}
#line.fade{transition:opacity .35s;opacity:0}
#sign{height:1.4em;margin:-10px 0 0;color:var(--dim);font-size:16px;opacity:0;transition:opacity 1.6s 1.4s}
body.end #sign{opacity:1}
#hint{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;font-size:14px;color:var(--dim);animation:blink 2.6s ease-in-out infinite;transition:opacity .5s}
@keyframes blink{50%{opacity:.35}}
body.end #hint{opacity:0;animation:none}
#again{display:none;font:inherit;font-size:15px;color:var(--silver);background:none;border:1px solid var(--dim);border-radius:99px;padding:8px 20px;cursor:pointer}
#again:hover,#again:focus-visible{border-color:var(--rose);color:var(--rose);outline:none}
body.end #again{display:inline-block}
/* Trình phát nhạc */
#mp{display:none;width:min(88vw,380px);flex-direction:column;gap:14px;animation:wd 1s both}
body.mp #mp{display:flex}
body.mp #line,body.mp #sign{display:none}
#stage[data-s=music]{width:min(30vw,110px)}
#stage[data-s=music] #moon{opacity:1;transform:scale(1)}
.mc,.mpl{background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:2px solid #fff;border-radius:26px;padding:16px 14px}
#mt{margin:0 0 8px;font-size:clamp(20px,6vw,26px);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#mcr{margin:0;font-size:13px;color:var(--dim)}
.dots{margin:6px 0;letter-spacing:.3em}
#ly1{margin:0;font-size:clamp(16px,4.6vw,19px);line-height:1.5;transition:opacity .35s}
#ly2{margin:4px 0 0;font-size:14px;color:var(--dim);line-height:1.5;min-height:1.5em}
#tr{position:relative;height:10px;border-radius:6px;background:rgba(255,255,255,.3);cursor:pointer;margin:6px 4px 4px}
#pf{height:100%;width:0;border-radius:6px;background:#fff}
#pt{position:absolute;top:50%;left:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.7)}
.tm{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin:0 4px 10px}
.cb{display:flex;justify-content:space-around;align-items:center;padding:0 4px}
.cb button{background:none;border:0;color:#fff;cursor:pointer;padding:4px;line-height:0}
.cb button:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:50%}
.cb svg{width:34px;height:34px;fill:#fff}
#bm svg{width:22px;height:22px}
.vol{display:flex;align-items:center;gap:10px;margin:12px 4px 0}
.vol button{background:none;border:0;padding:4px;line-height:0;cursor:pointer}
.vol button:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:50%}
.vol svg{width:24px;height:24px;fill:#fff}
#bv.off svg{opacity:.4}
#vl{flex:1;height:22px;accent-color:#fff;cursor:pointer;background:transparent}
#bh svg{fill:none;stroke:#fff;stroke-width:1.6}
#bh.on svg{fill:var(--rose);stroke:var(--rose)}
#bm{width:46px;height:46px;border:2px solid #fff;border-radius:50%;font-size:14px;letter-spacing:.1em;line-height:1;padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ===== DREAMY 3D / CUTE UPGRADE ===== */
:root{
  --night:#090a25;--deep:#29245d;--silver:#fff5f6;--rose:#ffc1d7;--dim:#c2b6e8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:
    radial-gradient(ellipse at 15% 18%,rgba(111,91,218,.30),transparent 38%),
    radial-gradient(ellipse at 83% 25%,rgba(255,148,196,.17),transparent 34%),
    radial-gradient(ellipse at 50% 100%,rgba(67,96,190,.22),transparent 48%),
    linear-gradient(145deg,#09091f 0%,#17163f 48%,#090b28 100%);
  isolation:isolate;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.18;
  background-image:radial-gradient(rgba(255,255,255,.78) .65px,transparent .9px);
  background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent 90%);
}
#neb{
  background:
    radial-gradient(38% 34% at 22% 32%,rgba(125,111,255,.45),transparent 72%),
    radial-gradient(40% 42% at 78% 62%,rgba(255,119,184,.28),transparent 72%),
    radial-gradient(35% 30% at 60% 15%,rgba(116,210,255,.22),transparent 70%);
  filter:blur(22px);mix-blend-mode:screen;
}
#sky{z-index:1;pointer-events:none}
.ambient-decor{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.ambient-decor span{
  position:absolute;display:grid;place-items:center;opacity:.72;
  color:#ffe4f0;text-shadow:0 0 15px rgba(255,174,218,.8),0 0 34px rgba(157,145,255,.5);
  animation:floatDecor 6s ease-in-out infinite;
}
.ambient-decor .d1{left:9%;top:24%;font-size:26px;animation-delay:-1.5s}
.ambient-decor .d2{right:10%;top:34%;font-size:19px;animation-delay:-3.2s}
.ambient-decor .d3{left:15%;bottom:21%;font-size:18px;animation-delay:-2.4s}
.ambient-decor .d4{right:15%;bottom:18%;font-size:27px;animation-delay:-.8s}
.ambient-decor .d5{right:24%;top:13%;font-size:13px;animation-delay:-4s}
@keyframes floatDecor{0%,100%{transform:translate3d(0,0,0) rotate(-8deg) scale(1)}50%{transform:translate3d(8px,-17px,20px) rotate(12deg) scale(1.12)}}
main{
  z-index:2;gap:clamp(12px,3.3vh,30px);padding:0 24px;
  perspective:1200px;isolation:isolate;
}
main::before{
  content:"";position:absolute;z-index:0;pointer-events:none;
  width:min(94vw,720px);height:min(84vh,760px);border-radius:36px;
  border:1px solid rgba(255,235,250,.18);
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.018) 42%,rgba(138,126,255,.055));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 30px 90px rgba(0,0,0,.24),0 0 80px rgba(152,126,255,.055);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
}
main>*{z-index:1}
#top-copy{
  position:absolute;z-index:4;top:calc(22px + env(safe-area-inset-top,0px));left:16px;right:16px;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
}
.top-badge{
  display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:999px;
  color:#ffe8f3;font:600 10px/1.2 system-ui,-apple-system,sans-serif;letter-spacing:.22em;
  background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.035));
  border:1px solid rgba(255,225,244,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 8px 24px rgba(0,0,0,.12);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.top-badge .moon-dot{width:7px;height:7px;border-radius:50%;background:#ffdbe9;box-shadow:0 0 10px #ffc1df,0 0 20px rgba(255,180,219,.7)}
.top-caption{font-size:12px;letter-spacing:.035em;color:rgba(235,224,255,.72);text-shadow:0 1px 10px rgba(0,0,0,.3)}
.story-progress{display:flex;gap:6px;align-items:center;margin-top:3px}
.progress-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25);box-shadow:0 0 0 1px rgba(255,255,255,.04);transition:all .5s ease}
.progress-dot.done{background:rgba(255,192,218,.72)}
.progress-dot.active{width:19px;border-radius:10px;background:linear-gradient(90deg,#f7b9dc,#d6c5ff);box-shadow:0 0 13px rgba(255,179,221,.65)}
#stage{
  width:min(62vw,290px);flex:0 0 auto;perspective:1100px;transform-style:preserve-3d;
  animation:sceneFloat 5.8s ease-in-out infinite;filter:drop-shadow(0 18px 22px rgba(0,0,0,.16));
}
@keyframes sceneFloat{0%,100%{translate:0 0}50%{translate:0 -8px}}
#stage::before{
  content:"";position:absolute;z-index:0;inset:5%;border-radius:50%;pointer-events:none;
  border:1px solid rgba(224,216,255,.18);box-shadow:0 0 24px rgba(182,166,255,.10),inset 0 0 24px rgba(182,166,255,.05);
  transform:rotateX(68deg) rotateZ(-18deg) translateZ(-18px);animation:stageOrbit 18s linear infinite;
}
#stage::after{
  content:"";position:absolute;z-index:0;left:18%;width:64%;height:17%;bottom:-4%;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse,rgba(160,145,255,.28),rgba(255,177,218,.10) 45%,transparent 72%);
  filter:blur(13px);transform:rotateX(62deg) translateZ(-24px);
}
@keyframes stageOrbit{from{transform:rotateX(68deg) rotateZ(-18deg)}to{transform:rotateX(68deg) rotateZ(342deg)}}
#stage>*{z-index:1;transform-style:preserve-3d}
#moon{overflow:visible;filter:drop-shadow(0 12px 18px rgba(0,0,0,.18)) drop-shadow(0 0 calc(10px + var(--glow,0)*48px) rgba(255,235,197,calc(.18 + var(--glow,0)*.5)))}
#moon g[mask]{filter:drop-shadow(-5px -7px 4px rgba(255,255,255,.16))}
#crystal{filter:drop-shadow(0 10px 24px rgba(0,0,0,.18))}
.core{
  background:radial-gradient(circle at 29% 23%,#fff 0%,hsl(var(--h),100%,88%) 10%,hsl(var(--h),96%,73%) 31%,hsl(var(--h),82%,48%) 68%,hsl(var(--h),88%,27%) 100%);
  box-shadow:0 0 58px 10px hsla(var(--h),96%,67%,.48),inset -15px -18px 28px hsla(var(--h),92%,20%,.58),inset 5px 5px 14px rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.48);transform:translateZ(20px);
}
.core::before{
  content:"";position:absolute;z-index:2;left:13%;top:9%;width:34%;height:18%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,255,255,.06));filter:blur(1px);transform:rotate(-35deg);pointer-events:none;
}
.core::after{
  content:"✦";position:absolute;z-index:3;right:18%;top:19%;font-size:clamp(11px,2.6vw,18px);color:rgba(255,255,255,.92);
  text-shadow:0 0 14px white,0 0 22px hsl(var(--h),100%,80%);animation:twinkle 2.4s ease-in-out infinite;pointer-events:none;
}
@keyframes twinkle{0%,100%{opacity:.45;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.18) rotate(22deg)}}
.ring{box-shadow:0 0 20px hsla(var(--h),100%,75%,.18)}
#clover{filter:drop-shadow(0 11px 13px rgba(0,0,0,.22)) drop-shadow(0 0 15px rgba(127,255,181,.15))}
.ph{border-radius:14px;border:1px solid rgba(255,255,255,.86);box-shadow:0 14px 32px rgba(0,0,0,.22),0 0 22px rgba(190,179,255,.40);backdrop-filter:blur(8px)}
#line{
  position:relative;z-index:2;max-width:min(88vw,580px);min-height:4.7em;margin:0;
  font-size:clamp(19px,4.7vw,27px);line-height:1.7;letter-spacing:.005em;font-weight:400;
  color:#fff3f7;text-wrap:balance;text-shadow:0 2px 22px rgba(7,7,28,.42);
  padding:clamp(10px,2vh,18px) clamp(10px,3vw,24px);border-radius:22px;
}
#line span{margin-right:0;text-shadow:0 2px 12px rgba(0,0,0,.18)}
#line.final{
  font-size:clamp(27px,7.2vw,43px);font-style:italic;font-weight:600;letter-spacing:.01em;
  color:#ffd1e5;text-shadow:0 0 22px rgba(255,167,212,.42),0 4px 28px rgba(0,0,0,.24);
}
#sign{position:relative;z-index:2;color:#d8cef9;font-size:14px;letter-spacing:.06em;text-shadow:0 0 16px rgba(184,163,255,.3)}
#hint{
  z-index:5;left:50%;right:auto;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));
  width:max-content;max-width:calc(100vw - 32px);padding:11px 17px;border:1px solid rgba(255,232,248,.19);border-radius:999px;
  background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 8px 28px rgba(0,0,0,.16);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font:500 12px/1.2 system-ui,sans-serif;letter-spacing:.04em;color:#e4d9fa;
}
#hint::after{content:"  ↗";display:inline-block;color:#ffc6e0;animation:hintNudge 1.6s ease-in-out infinite}
@keyframes hintNudge{50%{transform:translate(3px,-2px)}}
#again{
  position:relative;z-index:2;padding:10px 22px;border:1px solid rgba(255,220,241,.35);color:#fff0f7;
  background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.045));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 22px rgba(0,0,0,.14);backdrop-filter:blur(12px);
  transition:transform .25s,box-shadow .25s,border-color .25s;
}
#again:hover,#again:focus-visible{transform:translateY(-2px);border-color:#ffc7e0;color:#fff;box-shadow:0 0 24px rgba(255,169,214,.16);outline:none}
.mc,.mpl{
  border:1px solid rgba(255,235,250,.28);border-radius:24px;padding:17px 16px;
  background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.045));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 40px rgba(0,0,0,.18);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
}
#mt{color:#ffe6f1;text-shadow:0 0 18px rgba(255,170,214,.22)}
#bm{background:linear-gradient(145deg,rgba(255,224,240,.27),rgba(190,167,255,.16));box-shadow:0 0 20px rgba(255,181,220,.15);transition:transform .2s}
#bm:active{transform:scale(.93)}
#pf{background:linear-gradient(90deg,#ffc3de,#d3c5ff);box-shadow:0 0 12px rgba(255,189,223,.36)}
#pt{background:#fff0f8;box-shadow:0 0 14px rgba(255,191,227,.75)}
#vl{accent-color:#ffc7e1}
.vol svg,.cb svg{filter:drop-shadow(0 0 6px rgba(255,190,224,.22))}
@media(max-width:520px){
  main{padding-left:16px;padding-right:16px;gap:clamp(8px,2.1vh,18px)}
  main::before{width:calc(100vw - 22px);height:min(82vh,710px);border-radius:28px}
  #top-copy{top:calc(17px + env(safe-area-inset-top,0px));gap:6px}
  .top-badge{font-size:9px;padding:7px 11px;letter-spacing:.17em}
  .top-caption{font-size:11px}
  #stage{width:min(58vw,245px)}
  #line{min-height:4.5em;padding:8px 4px;line-height:1.62}
  #sign{font-size:13px}
  .ambient-decor .d1{left:5%;top:26%;font-size:20px}
  .ambient-decor .d2{right:5%;top:32%;font-size:16px}
  .ambient-decor .d3{left:7%;bottom:22%;font-size:15px}
  .ambient-decor .d4{right:7%;bottom:20%;font-size:22px}
  #mp{width:min(84vw,380px);gap:10px}
  .mc,.mpl{padding:14px 12px;border-radius:20px}
}
@media(max-height:650px){
  #top-copy{top:10px;gap:4px}.top-caption{display:none}.story-progress{margin-top:1px}
  #stage{width:min(48vh,220px)}main{gap:7px}
  #line{font-size:clamp(17px,3.2vh,22px);min-height:4.1em;line-height:1.45;padding:4px 6px}
  #line.final{font-size:clamp(25px,5.5vh,35px)}
  main::before{height:89vh}
}
@media(prefers-reduced-motion:reduce){.ambient-decor span,#stage::before,#stage,.core::after,#hint::after{animation:none!important}}


/* ===== Mini music dock: gọn ở góc, có thể ẩn/hiện và đổi bên ===== */
#mp{
  position:fixed!important;z-index:30;left:16px;right:auto;bottom:76px;
  width:min(218px,calc(100vw - 32px))!important;gap:7px!important;
  display:none;transform-origin:bottom left;animation:musicDockIn .28s cubic-bezier(.2,.8,.2,1) both;
  pointer-events:auto;
}
body.mp #mp{display:none!important}
body.mp.music-open #mp{display:flex!important}
body.music-right #mp{left:auto;right:16px;transform-origin:bottom right}
@keyframes musicDockIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
#musicToggle{
  display:none;position:fixed;z-index:32;left:18px;right:auto;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:48px;height:48px;border:1px solid rgba(255,231,249,.42);border-radius:50%;
  align-items:center;justify-content:center;gap:1px;color:#fff3fb;cursor:pointer;
  background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.3),transparent 45%),linear-gradient(145deg,rgba(255,191,224,.35),rgba(172,155,255,.28));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 7px 22px rgba(7,5,30,.28),0 0 20px rgba(255,185,224,.13);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:transform .2s,box-shadow .2s;
}
body.mp #musicToggle{display:flex}
body.music-right #musicToggle{left:auto;right:18px}
#musicToggle:hover{transform:translateY(-2px) scale(1.04);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 9px 26px rgba(7,5,30,.3),0 0 24px rgba(255,185,224,.24)}
#musicToggle:focus-visible,#musicSide:focus-visible,#musicClose:focus-visible{outline:2px solid #ffe6f4;outline-offset:3px}
.music-note{font:26px/1 Georgia,serif;text-shadow:0 0 12px rgba(255,202,231,.7);transform:translateY(-1px)}
.music-bars{height:17px;display:flex;align-items:center;gap:2px;margin-left:0}
.music-bars i{display:block;width:2px;height:5px;border-radius:3px;background:#ffe2f1;opacity:.9;animation:musicBars .8s ease-in-out infinite alternate}
.music-bars i:nth-child(2){height:11px;animation-delay:.15s}.music-bars i:nth-child(3){height:7px;animation-delay:.3s}.music-bars i:nth-child(4){height:13px;animation-delay:.45s}
body:not(.music-playing) .music-bars i{animation-play-state:paused;height:4px!important}
@keyframes musicBars{to{transform:scaleY(.4);opacity:.55}}
#mp .mc,#mp .mpl{padding:10px 11px!important;border-radius:16px!important;border:1px solid rgba(255,235,250,.26);background:linear-gradient(145deg,rgba(35,29,71,.76),rgba(24,22,59,.65));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 28px rgba(0,0,0,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.music-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.music-track{min-width:0;flex:1}
#mt{font-size:12px!important;line-height:1.25;margin:0 0 4px!important;letter-spacing:.09em!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mcr{font-size:10px!important;line-height:1.3;margin:0!important;color:#d4c7ed}
.music-tools{display:flex;gap:4px;flex-shrink:0}
.music-tools button{width:25px;height:25px;padding:0;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(255,255,255,.08);color:#fff1f8;font:16px/1 system-ui;cursor:pointer}
.music-tools button:hover{background:rgba(255,195,225,.22)}
#tr{height:5px!important;margin:2px 2px 5px!important;background:rgba(255,255,255,.2)}
#pf{min-height:5px}#pt{width:11px;height:11px;margin:-3px 0 0 -5px}
.tm{font-size:9px!important;margin:0 2px 6px!important}
.cb{gap:7px!important;justify-content:space-around!important;padding:0!important}
.cb button{padding:2px!important}
.cb svg{width:19px!important;height:19px!important}
#bm{width:34px!important;height:34px!important;border-width:1px!important;font-size:12px}

.vol{gap:7px!important;margin:7px 2px 0!important}

body.mp #line,body.mp #sign{display:none}

/* ===== Hình nền ảnh có thể thay đổi ===== */
#wallpaper{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;
  background-position:center;background-size:cover;background-repeat:no-repeat;
  transform:scale(1.025);transition:opacity 1.15s ease,filter 1.2s ease;
}
#wallpaper::after{content:"";position:absolute;z-index:2;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(14,7,30,.22),rgba(13,8,32,.12) 38%,rgba(7,8,28,.53));}
#wallpaperVideo{position:absolute;z-index:1;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.15s ease;pointer-events:none;background:#0a0927;}
#wallpaperVideo.active{opacity:1;}
#wallpaper.active{opacity:1}
body.wallpaper-photo #wallpaper{filter:saturate(.92)}
body.wallpaper-photo #neb{opacity:.12}
#wallpaperToggle{
  position:fixed;z-index:42;top:calc(17px + env(safe-area-inset-top,0px));right:16px;
  width:42px;height:42px;display:grid;place-items:center;padding:0;cursor:pointer;
  border:1px solid rgba(255,235,250,.38);border-radius:50%;color:#fff2fb;
  background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(182,158,255,.15));

  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);transition:transform .2s,background .2s;
}
#wallpaperToggle:hover{transform:translateY(-2px) rotate(-4deg);background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(182,158,255,.2))}
#wallpaperToggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.wallpaper-panel{
  display:none;position:fixed;z-index:41;top:calc(68px + env(safe-area-inset-top,0px));right:16px;
  width:min(282px,calc(100vw - 28px));max-height:min(70vh,530px);overflow:auto;padding:13px;
  border:1px solid rgba(255,231,249,.28);border-radius:20px;color:#fff3fb;
  background:linear-gradient(145deg,rgba(37,27,72,.92),rgba(22,19,54,.9));
  box-shadow:0 18px 55px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.15);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);transform-origin:top right;
}
body.wallpaper-menu-open .wallpaper-panel{display:block;animation:musicDockIn .22s ease both}
.wallpaper-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;font:600 13px/1.35 system-ui,sans-serif;letter-spacing:.02em}
.wallpaper-panel-head button{width:26px;height:26px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(255,255,255,.08);color:#fff;font:18px/1 system-ui;cursor:pointer}
.wallpaper-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wallpaper-choice{min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:6px;border-radius:12px;border:1px solid rgba(255,255,255,.15);color:#f7edff;background:rgba(255,255,255,.045);font:500 11px/1.3 system-ui,sans-serif;text-align:left;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}

.wallpaper-choice.active{border-color:#ffc5e0;background:rgba(255,190,222,.13);box-shadow:0 0 0 1px rgba(255,190,222,.09),0 0 16px rgba(255,166,218,.12)}
.wallpaper-thumb{height:62px;display:block;border-radius:8px;background-position:center;background-size:cover;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.wallpaper-choice span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallpaper-upload,.wallpaper-auto{width:100%;min-height:34px;margin-top:9px;padding:8px 10px;display:flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid rgba(255,228,245,.19);border-radius:10px;background:rgba(255,255,255,.07);color:#fff2fa;font:500 11px/1.35 system-ui,sans-serif;text-align:center;cursor:pointer;}
.wallpaper-upload:hover,.wallpaper-auto:hover{background:rgba(255,194,224,.13);border-color:rgba(255,215,239,.38)}
.wallpaper-upload input{display:none}
.wallpaper-auto.active{background:rgba(255,184,220,.15);border-color:rgba(255,195,226,.42);color:#ffd7eb}
.wallpaper-note{margin:9px 2px 0;color:rgba(235,224,255,.68);font:10px/1.5 system-ui,sans-serif}

/* ===== Bỏ hoàn toàn hiệu ứng hành tinh và vòng quỹ đạo ===== */
#crystal{display:none!important}
#stage::before{display:none!important}

/* ===== Ảnh thật bay quanh biểu tượng, thay cho video trong từng lời chúc ===== */
#stage{isolation:isolate;z-index:3}
#stage #galaxy{z-index:4;opacity:0;transform:scale(.88);pointer-events:none;overflow:visible}

.ph img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit;user-select:none;-webkit-user-drag:none}
@media(max-width:520px){#galaxy{--R:min(40vw,154px);--w:min(18vw,66px)}.ph{border-radius:11px}}

/* Mở đầu chỉ hiện lời chúc; bộ ảnh 3D mờ dần xuất hiện từ màn kế tiếp. */

body.photos-started #stage #galaxy{visibility:visible;transition:opacity 1.1s ease,transform 1.2s cubic-bezier(.2,.8,.2,1);}
#ring{animation-duration:22s;}

<script>
/* ===== Chỉnh lời chúc ở đây ===== */
var SENDER = "em của chị";
var MUSIC = "music.mp3";
var SONG = {title:"Chờ chút", credit:"Hi"};

var S = [
  {t:'moon', p:0,   x:"Chị Moon ơi, em có món quà nhỏ này muốn gửi chị nè"},
  {t:'moon', p:.35, x:"20/10 rồi, em muốn chúc chị vài câu. Bình thường nhiều khi nghĩ vậy thôi chứ cũng ít khi nói ra ha"},
  {t:'moon', p:.50, x:"Chúc chị luôn khỏe nha, nhớ ăn uống đàng hoàng với ngủ đủ nữa. Đừng mải lo chuyện này chuyện kia rồi quên chăm sóc mình đó"},
  {t:'moon', p:.68, x:"Em mong chị lúc nào cũng có người để tám chuyện, kể cả mấy chuyện linh tinh nhất, mà vẫn vui vẻ ngồi nghe chị kể"},
  {t:'moon', p:.42, x:"Những điều chị đang mong, em mong chị sẽ đạt được từng chút một. Không cần vội đâu, cứ đi theo cách của chị là được"},
  {t:'clover', x:"Nếu có hôm nào mệt hay không vui thì nghỉ ngơi một chút nha. Không cần lúc nào cũng phải tỏ ra mình ổn đâu"},
  {t:'moon', p:1, f:1, x:"Chúc chị Moon 20/10 vui vẻ nhaa ♡ Mong hôm nay chị cười thật nhiều, được ăn món ngon và gặp toàn chuyện vui thôi"},
  {t:'music', e:1, x:""},
];
/* ================================= */
var $ = function(id){return document.getElementById(id)};
var stage=$('stage'), line=$('line'), sh=$('sh'), moon=$('moon'), i=-1, busy=false, mode='moon', hue=200;
var calm = matchMedia('(prefers-reduced-motion:reduce)').matches;

function words(t){return t.split(' ').map(function(w,k){return '<span style="animation-delay:'+(k*85)+'ms">'+w+'</span>'}).join(' ')}
function go(k){
  var s=S[k]; busy=true; line.classList.add('fade');
  var progressDots=document.querySelectorAll('.progress-dot');
  var activeDot=Math.min(k,progressDots.length-1);
  progressDots.forEach(function(dot,idx){
    dot.classList.toggle('active',idx===activeDot);
    dot.classList.toggle('done',idx<activeDot);
  });
  stage.dataset.s=s.t; mode=s.f?'finale':s.t; document.body.classList.toggle('gx',s.t==='crystal'); document.body.classList.toggle('mp',s.t==='music');
  // Giữ phần mở đầu gọn gàng; ảnh kỷ niệm chỉ bay vào từ lời chúc thứ hai.
  document.body.classList.toggle('photos-started',k>0);
  if(s.t==='moon'){sh.style.transform='translate('+(26+s.p*190)+'px,0)'; moon.style.setProperty('--glow',s.p)}
  if(s.t==='crystal'){$('crystal').style.setProperty('--h',s.h); hue=s.h; $('neb').style.filter='blur(10px) hue-rotate('+(s.h-160)+'deg)'}
  setStoryBackground(k); // Mỗi lời chúc chuyển nền đúng một lần.
  setTimeout(function(){
    line.classList.toggle('final',!!s.f); line.innerHTML=words(s.x); line.classList.remove('fade'); busy=false;
    if(s.f)burst(innerWidth/2,innerHeight*.3,60);
    if(s.e){document.body.classList.add('end'); $('sign').textContent='— '+SENDER}
  },380);
}

var cv=$('sky'), cx=cv.getContext('2d'), W, H, stars=[], met=[], P=[], px=0, py=0, last=0, lastBurst=0;
function size(){

  cv.width=W*d; cv.height=H*d; cx.setTransform(d,0,0,d,0,0); stars=[];
  for(var k=0,n=Math.round(W*H/5200);k<n;k++){var z=k%3;stars.push({x:Math.random()*W,y:Math.random()*H,r:.3+z*.45+Math.random()*.5,z:z,p:Math.random()*6.28,s:.6+Math.random()*1.6})}
}

function burst(x,y,n){
  var h=Math.random()*360;
  for(var k=0;k<n;k++){var a=k/n*6.283,v=1.5+Math.random()*3;P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.04,l:0,m:80+Math.random()*40,r:1.6,h:h+Math.random()*50})}
}
function spawn(){
  var c=stage.getBoundingClientRect(), cxm=c.left+c.width/2, cym=c.top+c.height/2, r=Math.random();
  if(mode==='crystal'){var a=Math.random()*6.283; P.push({x:cxm+Math.cos(a)*c.width*.45,y:cym+Math.sin(a)*c.width*.45,vx:Math.cos(a)*.3,vy:Math.sin(a)*.3-.35,g:0,l:0,m:110,r:1.8,h:hue})}
  else if(mode==='clover'){P.push({x:Math.random()*W,y:H+8,vx:(Math.random()-.5)*.5,vy:-.5-Math.random(),g:0,l:0,m:260,r:2,h:130,w:Math.random()*6})}
  else if(mode==='galaxy'){var ga=Math.random()*6.283; P.push({x:cxm,y:cym,vx:Math.cos(ga)*1.1,vy:Math.sin(ga)*.6,g:0,l:0,m:170,r:1.7,h:hue-30+Math.random()*80})}
  else if(mode==='finale'){P.push({x:Math.random()*W,y:-6,vx:(Math.random()-.5)*.4,vy:.8+Math.random()*1.2,g:0,l:0,m:300,r:1.8,h:45});
    if(performance.now()-lastBurst>1100){lastBurst=performance.now();burst(W*(.15+Math.random()*.7),H*(.12+Math.random()*.35),44)}}
}
function draw(t){
  cx.globalCompositeOperation='source-over'; cx.clearRect(0,0,W,H);
  for(var k=0;k<stars.length;k++){var s=stars[k],o=(s.z+1)*9;
    cx.globalAlpha=calm?.7:.3+.65*Math.abs(Math.sin(t/1000*s.s+s.p)); cx.fillStyle='#f3ecd2';
    cx.beginPath(); cx.arc(s.x-px*o,s.y-py*o,s.r,0,6.283); cx.fill()}
  cx.globalCompositeOperation='lighter';
  if(t-last>(mode==='finale'?900:5200)){met.push({x:W*(.3+Math.random()*.7),y:Math.random()*H*.35,v:8+Math.random()*5,l:0});last=t}
  for(var m=met.length-1;m>=0;m--){var q=met[m]; q.x-=q.v; q.y+=q.v*.5; q.l++;
    var al=Math.max(0,1-q.l/75), g=cx.createLinearGradient(q.x,q.y,q.x+110,q.y-55);
    g.addColorStop(0,'rgba(255,255,255,'+al+')'); g.addColorStop(1,'rgba(130,200,255,0)');
    cx.globalAlpha=1; cx.strokeStyle=g; cx.lineWidth=2; cx.beginPath(); cx.moveTo(q.x,q.y); cx.lineTo(q.x+110,q.y-55); cx.stroke();
    cx.fillStyle='rgba(255,255,255,'+al+')'; cx.beginPath(); cx.arc(q.x,q.y,2.6,0,6.283); cx.fill();
    if(q.l>75)met.splice(m,1)}
  if(Math.random()<.35&&P.length<420)spawn();
  for(var j=P.length-1;j>=0;j--){var p=P[j]; p.l++; p.vy+=p.g; p.x+=p.vx+(p.w!=null?Math.sin(p.l/20+p.w)*.4:0); p.y+=p.vy;
    var a=1-p.l/p.m; if(a<=0){P.splice(j,1);continue}
    cx.globalAlpha=a; cx.fillStyle='hsl('+p.h+',95%,70%)'; cx.beginPath(); cx.arc(p.x,p.y,p.r*(.6+a*.6),0,6.283); cx.fill()}
  if(!calm)requestAnimationFrame(draw)
}

/* ===== Ảnh nền (ảnh hoặc video) và ảnh bay đọc từ thư mục cạnh HTML =====
   Nền: backgrounds/bg1.jpg, bg2.mp4, bg3.webp... (đánh số liên tục)
   Video nền hỗ trợ MP4, WEBM, OGV; khuyến nghị MP4 mã hóa H.264.
   Ảnh bay: photos/photo1.jpg, photo2.jpg...; tối đa 12 mục mỗi thư mục.
*/
var STORY_BACKGROUNDS=[], FLOATING_PHOTOS=[];
var IMAGE_EXTENSIONS=['jpg','jpeg','png','webp','avif'];
var VIDEO_EXTENSIONS=['mp4','webm','ogv'];
function findLocalImage(base){
  return new Promise(function(resolve){
    var pos=0;
    function attempt(){
      if(pos>=IMAGE_EXTENSIONS.length){resolve(null);return;}
      var url=base+'.'+IMAGE_EXTENSIONS[pos++],img=new Image();
      img.onload=function(){resolve(url)};
      img.onerror=attempt;
      img.src=url;
    }
    attempt();
  });
}
function findLocalBackground(base){
  return new Promise(function(resolve){
    var extensions=IMAGE_EXTENSIONS.map(function(ext){return {ext:ext,type:'image'}})
      .concat(VIDEO_EXTENSIONS.map(function(ext){return {ext:ext,type:'video'}}));
    var pos=0;
    function attempt(){
      if(pos>=extensions.length){resolve(null);return;}
      var candidate=extensions[pos++],url=base+'.'+candidate.ext;
      if(candidate.type==='image'){
        var img=new Image();
        img.onload=function(){resolve({src:url,type:'image'})};
        img.onerror=attempt;
        img.src=url;
      }else{
        var video=document.createElement('video');
        video.preload='metadata';video.muted=true;video.playsInline=true;
        var finished=false;
        video.onloadedmetadata=function(){
          if(finished)return;finished=true;video.onloadedmetadata=null;video.onerror=null;
          resolve({src:url,type:'video'});
        };
        video.onerror=function(){
          if(finished)return;finished=true;video.onloadedmetadata=null;video.onerror=null;
          video.removeAttribute('src');video.load();attempt();
        };
        video.src=url;video.load();
      }
    }
    attempt();
  });
}
function loadNumberedFolder(folder,prefix,limit){
  return new Promise(function(resolve){
    var found=[],num=1;
    function nextFile(){
      if(num>limit){resolve(found);return;}
      var probe=folder==='backgrounds'
        ? findLocalBackground(folder+'/'+prefix+num)
        : findLocalImage(folder+'/'+prefix+num).then(function(src){return src?{src:src,type:'image'}:null});
      probe.then(function(asset){
        // Dừng ở số đầu tiên bị thiếu để tránh quét cả thư mục vô ích.
        if(!asset){resolve(found);return;}
        found.push({num:num,src:asset.src,type:asset.type||'image'});num++;nextFile();
      }).catch(function(){resolve(found)});
    }
    nextFile();
  });
}
function renderFloatingPhotos(items){
  var ring=$('ring');ring.innerHTML='';
  document.body.classList.toggle('hasph',items.length>0);
  if(!items.length)return;
  var n=items.length;
  items.forEach(function(item,k){
    var d=document.createElement('div');d.className='ph';
    d.style.cssText='--a:'+(k*360/n)+'deg;--y:'+(Math.sin(k*2.1)*34)+'px';
    var img=document.createElement('img');img.src=item.src;img.alt='Ảnh kỷ niệm '+item.num;img.loading='eager';img.draggable=false;
    d.appendChild(img);ring.appendChild(d);
  });
}
function displayWallpaper(item){
  var wall=$('wallpaper'),video=$('wallpaperVideo');
  wall.classList.remove('active');video.classList.remove('active');
  window.setTimeout(function(){
    video.pause();video.onloadeddata=null;video.onerror=null;
    if(item&&item.src&&item.type==='video'){
      wall.style.backgroundImage='none';
      video.muted=true;video.loop=true;video.playsInline=true;video.preload='auto';
      function revealVideo(){
        video.onloadeddata=null;video.onerror=null;
        wall.classList.add('active');video.classList.add('active');document.body.classList.add('wallpaper-photo');
        var playResult=video.play();if(playResult&&playResult.catch)playResult.catch(function(err){console.warn('Không thể tự phát video nền:',err)});
      }
      function videoFallback(){
        video.onloadeddata=null;video.onerror=null;video.classList.remove('active');
        wall.style.backgroundImage='linear-gradient(145deg,#090a26,#28245e 55%,#10112d)';
        wall.classList.add('active');document.body.classList.add('wallpaper-photo');
        console.warn('Không thể tải video nền:',item.src);
      }
      video.onloadeddata=revealVideo;video.onerror=videoFallback;
      if(video.dataset.src!==item.src){video.dataset.src=item.src;video.src=item.src;video.load();}
      else if(video.readyState>=2){revealVideo();}
      else{video.load();}
    }else if(item&&item.src){
      video.removeAttribute('src');video.removeAttribute('data-src');video.load();
      wall.style.backgroundImage=safeCssUrl(item.src);wall.classList.add('active');document.body.classList.add('wallpaper-photo');
    }else{
      video.removeAttribute('src');video.removeAttribute('data-src');video.load();
      wall.style.backgroundImage='';wall.classList.remove('active');document.body.classList.remove('wallpaper-photo');
    }
  },130);
}
function syncWallpaperChoice(item){
  if(!item)return;
  var idx=wallpaperItems.findIndex(function(w){return w.id===item.id});
  if(idx>=0)selectedWallpaper=idx;
  wallpaperChoicesEl.querySelectorAll('.wallpaper-choice').forEach(function(btn){
    var active=Number(btn.dataset.index)===selectedWallpaper;
    btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',active?'true':'false');
  });
}
function setStoryBackground(k){
  var item=null;
  if(STORY_BACKGROUNDS.length>1){
    item=STORY_BACKGROUNDS[k%STORY_BACKGROUNDS.length];
  }else if(STORY_BACKGROUNDS.length===1){
    // Nếu chỉ có một nền, xen kẽ nền đó với nền vũ trụ.
    if(k%2===0)item=STORY_BACKGROUNDS[0];
  }else if(k%2===0&&typeof SAMPLE_WALLPAPER!=='undefined'){
    item={id:'sakura',src:SAMPLE_WALLPAPER,type:'image'};
  }
  if(item&&item.num!=null){
    var itemInPanel=wallpaperItems.find(function(w){return w.id==='story-bg-'+item.num});
    if(itemInPanel)syncWallpaperChoice(itemInPanel);
  }
  displayWallpaper(item);
  if(typeof wallpaperAutoTimer!=='undefined'&&wallpaperAutoTimer){
    clearInterval(wallpaperAutoTimer);wallpaperAutoTimer=null;
    var autoBtn=$('wallpaperAuto');
    if(autoBtn){autoBtn.classList.remove('active');autoBtn.textContent='✧ Tự động đổi nền: Tắt';}
  }
}

var wallpaperEl = $('wallpaper');
var wallpaperChoicesEl = $('wallpaperChoices');
var wallpaperItems = [
  {id:'sakura', name:'Sakura hồng', src:SAMPLE_WALLPAPER, thumb:SAMPLE_WALLPAPER},
  {id:'space', name:'Vũ trụ sao', src:'', thumb:''}
];
var selectedWallpaper = 0, wallpaperAutoTimer = null;
function safeCssUrl(url){return 'url("'+url.replace(/"/g,'%22')+'")'}
function setWallpaper(index){
  if(!wallpaperItems.length)return;
  selectedWallpaper=(index+wallpaperItems.length)%wallpaperItems.length;
  var item=wallpaperItems[selectedWallpaper];
  displayWallpaper(item);
  wallpaperChoicesEl.querySelectorAll('.wallpaper-choice').forEach(function(btn){
    var isActive=Number(btn.dataset.index)===selectedWallpaper;
    btn.classList.toggle('active',isActive);btn.setAttribute('aria-pressed',isActive?'true':'false');
  });
}
function renderWallpaperChoices(){
  wallpaperChoicesEl.innerHTML='';
  wallpaperItems.forEach(function(item,index){
    var btn=document.createElement('button');btn.type='button';btn.className='wallpaper-choice';btn.dataset.index=String(index);btn.setAttribute('aria-pressed',index===selectedWallpaper?'true':'false');
    var thumb=document.createElement('span');thumb.className='wallpaper-thumb';
    if(item.thumb){thumb.style.backgroundImage=safeCssUrl(item.thumb);}else{thumb.style.backgroundImage='radial-gradient(circle at 50% 28%,rgba(255,228,190,.95),transparent 9%),radial-gradient(ellipse at 20% 35%,rgba(130,103,255,.65),transparent 45%),radial-gradient(ellipse at 80% 70%,rgba(244,131,196,.38),transparent 44%),linear-gradient(145deg,#090a26,#28245e 55%,#10112d)';}
    var name=document.createElement('span');name.textContent=item.name;
    btn.appendChild(thumb);btn.appendChild(name);
    btn.addEventListener('click',function(e){e.stopPropagation();setWallpaper(index);if(wallpaperAutoTimer){clearInterval(wallpaperAutoTimer);wallpaperAutoTimer=null;$('wallpaperAuto').classList.remove('active');$('wallpaperAuto').textContent='✧ Tự động đổi nền: Tắt';}});
    wallpaperChoicesEl.appendChild(btn);
  });
}
$('wallpaperToggle').addEventListener('click',function(e){
  e.stopPropagation();var opened=document.body.classList.toggle('wallpaper-menu-open');$('wallpaperPanel').setAttribute('aria-hidden',opened?'false':'true');
});
$('wallpaperPanel').addEventListener('click',function(e){e.stopPropagation()});
$('wallpaperPanelClose').addEventListener('click',function(e){e.stopPropagation();document.body.classList.remove('wallpaper-menu-open');$('wallpaperPanel').setAttribute('aria-hidden','true')});
$('wallpaperInput').addEventListener('change',async function(e){
  e.stopPropagation();var files=Array.from(this.files||[]).filter(function(f){return f.type&&(f.type.indexOf('image/')===0||f.type==='video/mp4'||f.type==='video/webm'||f.type==='video/ogg')}).slice(0,12);
  for(var fi=0;fi<files.length;fi++){
    var file=files[fi];
    try{
      if(file.type.indexOf('video/')===0){
        wallpaperItems.push({id:'custom-video-'+Date.now()+'-'+fi,name:file.name||('Video của bạn '+(fi+1)),src:URL.createObjectURL(file),type:'video',thumb:''});
        continue;
      }
      var dataUrl;
      if(window.createImageBitmap){
        var bitmap=await createImageBitmap(file);var maxSide=1920,scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
        var canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
        var ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);if(bitmap.close)bitmap.close();
        dataUrl=canvas.toDataURL('image/jpeg',.86);
      }else{
        dataUrl=await new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(){resolve(reader.result)};reader.onerror=reject;reader.readAsDataURL(file)});
      }
      wallpaperItems.push({id:'custom-'+Date.now()+'-'+fi,name:file.name||('Ảnh của bạn '+(fi+1)),src:dataUrl,thumb:dataUrl});
    }catch(err){console.warn('Không thể đọc ảnh nền:',file.name,err)}
  }
  renderWallpaperChoices();
  if(files.length){setWallpaper(wallpaperItems.length-1);$('wallpaperNote').textContent='Đã thêm '+files.length+' ảnh/video. Video sẽ tự chạy lặp khi được chọn.';}
  this.value='';
});
$('wallpaperAuto').addEventListener('click',function(e){
  e.stopPropagation();
  if(wallpaperAutoTimer){clearInterval(wallpaperAutoTimer);wallpaperAutoTimer=null;this.classList.remove('active');this.textContent='✧ Tự động đổi nền: Tắt';}
  else if(wallpaperItems.length>1){
    this.classList.add('active');this.textContent='✧ Tự động đổi nền: Bật';
    wallpaperAutoTimer=setInterval(function(){setWallpaper(selectedWallpaper+1)},8500);
  }else{this.textContent='Thêm ảnh trước nhé ♡';}
});
renderWallpaperChoices();
setWallpaper(0);

Promise.all([
  loadNumberedFolder('backgrounds','bg',12),
  loadNumberedFolder('photos','photo',12)
]).then(function(results){
  STORY_BACKGROUNDS=results[0]||[];
  FLOATING_PHOTOS=results[1]||[];
  renderFloatingPhotos(FLOATING_PHOTOS);
  STORY_BACKGROUNDS.forEach(function(item){
    wallpaperItems.push({id:'story-bg-'+item.num,name:'Nền '+item.num+(item.type==='video'?' · video':''),src:item.src,type:item.type,thumb:item.type==='image'?item.src:''});
  });
  renderWallpaperChoices();
  next();
}).catch(function(err){
  console.warn('Không thể tải ảnh trong thư mục backgrounds/photos:',err);
  next();
});
/* Ảnh bay quanh biểu tượng; backgrounds/ hỗ trợ ảnh và video nền theo từng lời chúc. */
</script>
